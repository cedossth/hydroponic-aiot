<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Architecture du prototype AIoT hydroponique</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#263238">Architecture du prototype (état réellement réalisé)</text>
  <text x="30" y="60" font-size="13" fill="#546e7a">Deux branches : télémétrie / contrôle (ESP32 → MQTT → Node-RED) et vision embarquée (Raspberry Pi → TFLite → CouchDB → e-mail)</text>

  <!-- Capteurs -->
  <rect x="30" y="100" width="235" height="185" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="45" y="125" font-size="15" font-weight="bold" fill="#1b5e20">Capteurs</text>
  <g font-size="12.5" fill="#263238">
    <text x="45" y="150">• DHT22 : température, humidité</text>
    <text x="45" y="172">• Sonde pH (positionnée par servo)</text>
    <text x="45" y="194">• Capteur TDS : valeur brute</text>
    <text x="57" y="211" font-size="11" fill="#546e7a">(non convertie en ppm)</text>
    <text x="45" y="233">• LDR : luminosité (lux estimés)</text>
    <text x="45" y="255">• Flotteur : niveau d'eau</text>
  </g>

  <!-- Actionneurs -->
  <rect x="30" y="335" width="235" height="150" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="45" y="360" font-size="15" font-weight="bold" fill="#e65100">Actionneurs</text>
  <g font-size="12.5" fill="#263238">
    <text x="45" y="385">• Pompe (relais)</text>
    <text x="45" y="407">• Ventilateur (relais)</text>
    <text x="45" y="429">• Servo de la sonde pH</text>
    <text x="45" y="451">• 5 LED d'alerte</text>
  </g>

  <!-- ESP32 -->
  <rect x="300" y="150" width="235" height="285" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="315" y="176" font-size="14" font-weight="bold" fill="#0d47a1">ESP32 (firmware Arduino)</text>
  <g font-size="12.5" fill="#263238">
    <text x="315" y="202">• Lecture périodique</text>
    <text x="315" y="224">• Validation des mesures</text>
    <text x="315" y="246">• Règles à seuils locales :</text>
    <text x="329" y="266" font-size="11.5">ventilateur, LED d'alerte</text>
    <text x="315" y="288">• Cycle temporisé de la pompe</text>
    <text x="315" y="310">• Seuils modifiables via MQTT</text>
    <text x="315" y="332">• Commandes manuelles</text>
    <text x="329" y="352" font-size="11.5">(pompe, captures à la demande)</text>
  </g>
  <rect x="315" y="372" width="205" height="48" rx="6" fill="#fffde7" stroke="#f9a825"/>
  <text x="325" y="391" font-size="11.5" fill="#5d4037">Les actionneurs sont pilotés ici,</text>
  <text x="325" y="408" font-size="11.5" fill="#5d4037">pas par la vision par ordinateur.</text>

  <line x1="265" y1="190" x2="298" y2="215" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="300" y1="390" x2="267" y2="410" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Raspberry Pi -->
  <rect x="585" y="85" width="590" height="630" rx="14" fill="#fafafa" stroke="#c2185b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="110" font-size="15" font-weight="bold" fill="#880e4f">Raspberry Pi (serveur local, services systemd)</text>

  <rect x="605" y="135" width="175" height="80" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="618" y="160" font-size="14" font-weight="bold" fill="#311b92">Mosquitto</text>
  <text x="618" y="181" font-size="12" fill="#263238">Broker MQTT (port 1883)</text>
  <text x="618" y="200" font-size="11" fill="#546e7a">accès anonyme (prototype)</text>

  <rect x="830" y="130" width="325" height="145" rx="8" fill="#fbe9e7" stroke="#bf360c" stroke-width="1.5"/>
  <text x="845" y="155" font-size="14" font-weight="bold" fill="#bf360c">Node-RED</text>
  <g font-size="12" fill="#263238">
    <text x="845" y="178">• Orchestration des flux (147 nœuds)</text>
    <text x="845" y="198">• Tableau de bord : Accueil, Contrôle,</text>
    <text x="857" y="216">Configurations (accès HTTP local)</text>
    <text x="845" y="236">• Envoi des seuils et commandes</text>
    <text x="845" y="256">• Déclenchement de l'inférence</text>
  </g>

  <line x1="535" y1="215" x2="603" y2="175" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="345" y="96" font-size="11.5" font-weight="bold" fill="#37474f">MQTT sur Wi-Fi</text>
  <text x="345" y="112" font-size="10.5" fill="#546e7a">↑ sensors/*, status/*, config/*</text>
  <text x="345" y="127" font-size="10.5" fill="#546e7a">↓ control/* (16 topics de commande)</text>
  <line x1="780" y1="175" x2="828" y2="190" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="830" y="315" width="160" height="70" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="843" y="340" font-size="14" font-weight="bold" fill="#006064">InfluxDB 2</text>
  <text x="843" y="361" font-size="12" fill="#263238">Séries temporelles</text>
  <text x="843" y="377" font-size="11" fill="#546e7a">6 mesures capteurs</text>
  <line x1="910" y1="275" x2="910" y2="313" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="1015" y="315" width="140" height="70" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1028" y="340" font-size="14" fill="#616161">Grafana</text>
  <text x="1028" y="361" font-size="12" fill="#757575">Essai de</text>
  <text x="1028" y="377" font-size="12" fill="#757575">visualisation</text>
  <line x1="990" y1="350" x2="1013" y2="350" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Vision -->
  <text x="605" y="430" font-size="14" font-weight="bold" fill="#6a1b9a">Branche vision (exécutée sur le Raspberry Pi)</text>
  <line x1="1060" y1="275" x2="1060" y2="300" stroke="#6a1b9a" stroke-width="1.6"/>
  <path d="M1060,300 L1163,300 L1163,520 L1067,520" fill="none" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#v)"/>
  
  <rect x="605" y="455" width="160" height="75" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="617" y="480" font-size="13.5" font-weight="bold" fill="#4a148c">Caméra Pi</text>
  <text x="617" y="500" font-size="12" fill="#263238">capture libcamera</text>
  <text x="617" y="517" font-size="11" fill="#546e7a">1296×972 ou 640×480</text>

  <rect x="800" y="455" width="265" height="105" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="813" y="480" font-size="13.5" font-weight="bold" fill="#4a148c">Script Python d'inférence</text>
  <text x="813" y="500" font-size="12" fill="#263238">Ultralytics + modèle TFLite (YOLOv9t)</text>
  <text x="813" y="518" font-size="12" fill="#263238">• ravageurs : nuisible_inference.py</text>
  <text x="813" y="536" font-size="12" fill="#263238">• maladies : plant_inference.py</text>
  <text x="813" y="553" font-size="11" fill="#546e7a">lancé par Node-RED toutes les 4 / 5 min</text>
  <line x1="765" y1="492" x2="798" y2="492" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#v)"/>

  <rect x="605" y="600" width="200" height="85" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="618" y="625" font-size="13.5" font-weight="bold" fill="#e65100">CouchDB</text>
  <text x="618" y="645" font-size="12" fill="#263238">résultat + image annotée</text>
  <text x="618" y="663" font-size="12" fill="#263238">(pièce jointe, API REST)</text>

  <rect x="850" y="600" width="200" height="85" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5"/>
  <text x="863" y="625" font-size="13.5" font-weight="bold" fill="#e65100">Alerte e-mail</text>
  <text x="863" y="645" font-size="12" fill="#263238">SMTP, image jointe,</text>
  <text x="863" y="663" font-size="12" fill="#263238">seulement si détection</text>

  <path d="M860,560 L860,580 L705,580 L705,598" fill="none" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#v)"/>
  <line x1="950" y1="560" x2="950" y2="598" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#v)"/>

  <!-- Légende -->
  <g font-size="11.5" fill="#455a64">
    <line x1="30" y1="555" x2="70" y2="555" stroke="#37474f" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="80" y="559">flux de télémétrie / commande</text>
    <line x1="30" y1="580" x2="70" y2="580" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#v)"/>
    <text x="80" y="584">flux de la branche vision</text>
    <line x1="30" y1="605" x2="70" y2="605" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="80" y="609">essai non central</text>
    <text x="30" y="650" font-size="11" fill="#78909c">Prototype académique —</text>
    <text x="30" y="666" font-size="11" fill="#78909c">réseau local, non prévu pour la production.</text>
  </g>
</svg>
